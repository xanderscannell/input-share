[package]
name = "input-share-gui"
version = "0.2.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
input-share-core = { path = "../core" }
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
